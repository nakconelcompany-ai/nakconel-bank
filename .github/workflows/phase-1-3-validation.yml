name: Phase 1-3 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-1-3-completion]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nakconel_test
      SESSION_SECRET: ci-only-session-secret-do-not-use-in-production-123456
      ENCRYPTION_KEY: ci-only-encryption-key-do-not-use-in-production-123456
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
